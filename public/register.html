<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="login-container">
    <h2>Register</h2>
    <form id="register-form">

      <!-- Full Name -->
      <div class="input-box">
        <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
        <i class="fa fa-user"></i>
      </div>

      <!-- Role Selection -->
      <div class="input-box select-box">
        <select id="role" name="role" required>
          <option value="">Select Role</option>
          <option value="Admin">Admin</option>
          <option value="Teacher">Teacher</option>
        </select>
        <i class="fa fa-user-shield"></i>
      </div>

      <!-- Grade Group (hidden for Admin via JS) -->
      <div class="input-box select-box" id="gradeGroupContainer">
        <select id="grade-group" name="grade_group">
          <option value="">-- Select Grade Group --</option>
          <option value="pp1_pp2_daycare">PP1 / PP2 / Daycare</option>
          <option value="grade1">Grade 1</option>
          <option value="grade2_3">Grade 2_3</option>
          <option value="grade4_5">Grade 4_5</option>
          <option value="grade6">Grade 6</option>
          <option value="grade7">Grade 7</option>
          <option value="grade8">Grade 8</option>
          <option value="grade9">Grade 9</option>
        </select>
      </div>

      <!-- Email -->
      <div class="input-box">
        <input type="email" id="email" name="email" placeholder="Email" required>
        <i class="fa fa-envelope"></i>
      </div>

      <!-- Password -->
      <div class="input-box">
        <input type="password" id="password" name="password" placeholder="Password" required>
        <i class="fa fa-lock"></i>
      </div>

      <!-- Confirm Password -->
      <div class="input-box">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
        <i class="fa fa-lock"></i>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-btn">Register</button>

      <!-- Already have an account -->
      <div class="register">
        Already have an account? <a href="login.html">Login</a>
      </div>

    </form>
  </div>

  <!-- JS for connecting to backend -->
  <script src="register.js"></script>
</body>
</html>

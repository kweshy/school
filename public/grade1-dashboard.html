<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Little Innovators Dashboard</title>
  <link rel="stylesheet" href="teacher.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      🎓 <span>Little Innovators</span>
    </div>

    <nav>
  <a href="grade1-dashboard.html" class="active">
    <i class="fa fa-chart-line"></i> Dashboard
  </a>

  <a href="student.html">
    <i class="fa fa-users"></i> Students
  </a>

  <a href="attendance.html">
    <i class="fa fa-calendar-check"></i> Attendance
  </a>

  <a href="homework.html">
    <i class="fa fa-book"></i> Homework
  </a>

  <a href="events.html">
    <i class="fa fa-calendar"></i> Events
  </a>

  <a href="reports.html">
    <i class="fa fa-file"></i> Report Cards
  </a>
</nav>
</aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <h1>Good Morning, Teacher! 👋</h1>
      <p>Here's what's happening in your classroom today.</p>
    </header>

    <!-- STATS -->
    <section class="stats">
      <div class="card teal">
  <i class="fa fa-users"></i>
  <h2 id="totalStudents">0</h2> <!-- added id -->
  <span>Total Students</span>
</div>
      <div class="card green">
        <i class="fa fa-clipboard-check"></i>
        <h2></h2>
        <span>Present Today</span>
      </div>

      <div class="card orange">
        <i class="fa fa-book-open"></i>
        <h2></h2>
        <span>Active Homework</span>
      </div>

      <div class="card blue">
        <i class="fa fa-calendar"></i>
        <h2></h2>
        <span>Upcoming Events</span>
      </div>
    </section>
  </main>
</div>
<script src="teacher.js"></script>
</body>
</html>
